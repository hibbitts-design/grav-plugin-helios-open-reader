title: Default
'@extends':
    type: default
    context: blueprints://pages

# Grav's standard page, with a Glossary setting, for a Glossary page in a publication beside its Topics or
# Resources pages (as in Grav Open Publishing Space) - hibbittsdesign.org
form:
  fields:
    tabs:
      fields:
        options:
          fields:
            glossary_section:
              type: section
              title: Glossary
              underline: true

            header.glossary:
              type: list
              label: Glossary
              style: vertical
              collapsed: true
              btnLabel: Add Term
              help: 'Use this page as the publication''s Glossary, instead of a Glossary section: put it in the publication''s folder, like a Topics page, in an unnumbered folder so it isn''t shown as a section card. Only needed on that one page. The terms are listed in alphabetical order at the end of its text (or where you add [glossary]); in the publication''s text, [term]OER[/term] (or the Glossary Term editor button) shows a term''s definition when hovered over, tapped or chosen with the keyboard.'
              fields:
                .term:
                  type: text
                  label: Term
                .definition:
                  type: textarea
                  label: Definition
                  rows: 3
