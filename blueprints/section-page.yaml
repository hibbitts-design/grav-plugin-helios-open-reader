title: Reader Page
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          title: PLUGIN_ADMIN.CONTENT
          fields:
            content:
              ordering@: 100
            header.media_order:
              ordering@: 101
            header.badge_label:
              type: text
              size: small
              label: Badge Label
              toggleable: true
              placeholder: 'e.g. New, Updated, Draft'
              help: 'A short status badge shown beside the section label on this page. Leave empty for no badge.'
            header.badge_color:
              type: select
              label: Badge Color
              toggleable: true
              default: default
              options:
                default: Default
                blue: Blue
                green: Green
                yellow: Yellow
                red: Red
                purple: Purple
                plain: Plain
              help: 'The badge colour.'
