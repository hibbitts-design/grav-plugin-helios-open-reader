name: Helios Open Reader
type: plugin
version: 1.1.8
description: Adds reader sections, reading progress, Keep My Place, shortcodes, and Admin Panel enhancements to the Helios Grav Premium theme for open textbooks and readers.
icon: newspaper-o
author:
  name: HibbittsDesign.org
  email: paul@hibbittsdesign.org
  url: https://hibbittsdesign.org
homepage: https://github.com/hibbitts-design/grav-plugin-helios-open-reader
demo: https://demo.hibbittsdesign.org/grav-plugin-helios-open-reader
keywords: grav, helios, reader, oer, open education
bugs: https://github.com/hibbitts-design/grav-plugin-helios-open-reader/issues
license: MIT
compatibility:
  grav: ['1.7', '2.0']

dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: shortcode-core, version: '>=5.0.0' }
  - { name: github-markdown-alerts, version: '>=1.0.0' }
  - { name: external_links, version: '>=1.6.3' }
  - { name: page-toc, version: '>=3.2.5' }
  - { name: simplesearch, version: '>=2.3.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    header_section:
      type: section
      title: 'Header'
      underline: true

    show_site_icon:
      type: toggle
      label: 'Show Site Logo Icon'
      help: 'Show the icon square next to the Logo Text when no logo image is set.'
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    site_icon:
      type: text
      size: medium
      label: 'Site Logo Icon'
      help: 'Tabler icon path for the site logo icon square (e.g. tabler/notebook.svg). Only applies when Show Site Logo Icon is enabled. Leave empty to use the default icon.'
      placeholder: 'tabler/notebook.svg'

    logo_link_target:
      type: select
      label: 'Single Publication Site Logo Link'
      help: 'Choose where the site Logo Text and icon link navigates when only one publication is listed.'
      default: 'single_publication'
      options:
        publications_list: 'Publications Home Page'
        single_publication: 'Home of Only Listed Publication (default)'

    typography_section:
      type: section
      title: 'Typography'
      underline: true

    content_text_size:
      type: select
      label: 'Content Text Scaling'
      help: 'Body text size for section/reading page content. Defaults to Comfortable. "Standard" reduces reading text size by one step (approx. 16px vs 18px at the theme''s default Medium font size).'
      default: 'comfortable'
      options:
        standard: 'Standard (Smaller Reading Text)'
        comfortable: 'Comfortable (Larger Reading Text, default)'

    custom_font_url:
      type: text
      size: long
      label: 'Custom Google Font URL'
      help: 'Stylesheet URL from the Google Fonts embed code (href of the third &lt;link&gt; tag). Leave empty to use the Helios theme font.'
      placeholder: 'https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap'

    custom_font_family:
      type: text
      size: medium
      label: 'Custom Font Family Name'
      help: 'CSS font-family value to apply as the body font (e.g. "Lora", serif). Copy from the font-family line in the Google Fonts CSS class example.'
      placeholder: '"Lora", serif'

    custom_font_size:
      type: select
      label: 'Custom Font Size'
      help: 'Base font size for the custom font. Defaults to Medium. Only applies when a Custom Google Font URL is set.'
      default: 'medium'
      options:
        small: 'Small'
        medium: 'Medium (default)'
        large: 'Large'

    custom_font_headings:
      type: toggle
      label: 'Apply Custom Font to Headings'
      help: 'Apply the custom font to headings. When disabled, headings use the Helios theme font.'
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    footer_section:
      type: section
      title: 'Footer'
      underline: true

    show_plugin_credits:
      type: toggle
      label: 'Show Plugin Credits'
      help: 'Show the "Built with Grav · Helios · Helios Open Reader" attribution line in the footer.'
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    integrations_section:
      type: section
      title: 'Integrations'
      underline: true

    show_github_header_icon:
      type: toggle
      label: 'Show Repository Host Icon Link in Header'
      help: 'Show a repository icon link in the site header. When a Custom Header Icon URL is set below, the icon displays regardless of whether Helios GitHub Integration is enabled.'
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    github_header_custom_url:
      type: text
      size: long
      label: 'Custom URL for Header Icon Link'
      help: 'Overrides the Helios theme repository URL for the header icon link, and works even without GitHub Integration enabled. Leave blank to use the Helios theme URL.'
      placeholder: 'https://github.com/your-org/your-repo'
      validate:
        type: url

    github_link_icon:
      type: text
      size: medium
      label: 'Git Link Icon'
      help: 'Tabler icon path for the Git link icon (e.g. tabler/file-text.svg). Only applies when GitHub Integration is enabled in the Helios theme settings.'
      placeholder: 'tabler/file-text.svg'

    github_link_mode:
      type: select
      label: 'Git Link Mode'
      help: 'The Helios theme''s "Edit this Page" option defaults to viewing the file. Switch to "Edit file" to restore direct editing. Only applies when GitHub Integration is enabled in the Helios theme settings.'
      default: 'view'
      options:
        view: 'View file (default)'
        edit: 'Edit file'

    github_server:
      type: radio
      label: 'Repository Host for Helios GitHub Integration'
      default: 'github.com'
      help: 'Only required when GitHub Integration is enabled in the Helios theme settings.'
      options:
        'github.com': GitHub
        'codeberg.org': Codeberg

    h5pembedrootpath:
      type: text
      size: long
      label: 'H5P Content Embed Source URL'
      default: 'https://h5p.org/h5p/embed/'
      description: 'H5P embed source URL path up to, but not including, the Content ID. For example, ''https://h5p.org/h5p/embed/'' or ''https://yourorganization.h5p.com/content/''.'
      validate:
        type: url

    plain_text_section:
      type: section
      title: 'Plain Text Version Link'
      underline: true

    publication_llms_full_enabled:
      type: toggle
      label: 'Serve Per-Publication llms-full.txt'
      help: 'Answer each reader''s own /<publication>/llms-full.txt with that reader''s full Markdown, instead of the Sitemap plugin''s single site-wide file. Needs Grav 2.1+ Markdown Output. Has no effect on single-publication sites.'
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    show_plain_text_link:
      type: toggle
      label: 'Show Plain Text Version Link in Footer'
      help: 'Show a "Plain text version" link in the footer to /llms-full.txt — each reader''s own file on multi-publication sites (requires Serve Per-Publication llms-full.txt above), or Sitemap''s site-wide file on single-publication sites (requires its "Serve llms-full.txt" setting).'
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    plain_text_link_label:
      type: text
      size: medium
      label: 'Plain Text Version Link Label'
      help: 'The label for the plain text version link shown in the footer.'
      placeholder: 'Plain text version'

    plain_text_link_icon:
      type: text
      size: medium
      label: 'Plain Text Version Link Icon'
      help: 'Tabler icon path shown before the plain text version link label (e.g. tabler/file-type-txt.svg). Leave empty to show no icon.'
      placeholder: 'tabler/book.svg'

    admin_panel_section:
      type: section
      title: 'Admin Panel 1.7'
      underline: true

    admin_styling_enhancements:
      type: toggle
      label: 'Helios-inspired Admin Styling'
      help: 'Apply Helios-inspired styling enhancements to the Admin Panel 1.7 (rounded corners, transitions, shadows, focus rings, table row hover, sidebar accent).'
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    admin_font_size:
      type: select
      label: 'Admin Font Size'
      help: 'Adjust the Admin 1.7 font size for improved readability.'
      default: 'large'
      options:
        default: 'Default (no changes)'
        large: 'Large'
        larger: 'Larger'
